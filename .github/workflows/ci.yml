name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --dev

      # WHY: one entry point. verify_repo.py runs ruff, format, pyright and pytest itself,
      # so listing them here again would only duplicate work and failure output.
      - name: Repository verification
        run: uv run python scripts/verify_repo.py
